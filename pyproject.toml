[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-router"
version = "0.1.0"
description = "Cost-aware execution for LLM agents: model cascades, prompt-cache-aware context layout, speculative tool prefetch, and budget enforcement, measured in dollars per solved task"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Atharv Santosh" }]
dependencies = [
  "pyyaml>=6.0",
  "click>=8.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]
gemini = [
  "google-genai>=1.0",
]

[project.scripts]
arouter = "arouter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arouter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
